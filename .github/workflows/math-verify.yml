name: Mathematical regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maths dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Chapter 3 question coverage
        run: python tests/check_ch03_coverage.py
      - name: Verify Chapter 1
        run: |
          python tests/verify_ch0101.py
          python tests/verify_ch0102_0105.py
      - name: Verify Chapter 2
        run: python tests/verify_ch02.py
      - name: Verify Chapter 3
        run: python tests/verify_ch03.py
